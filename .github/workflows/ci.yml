name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Flutter 3.41.4
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.41.4
    - name: Install dependencies
      run: |
        flutter pub get
    - name: Run tests
      run: |
        echo "CI works!"